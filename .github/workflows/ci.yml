name: Homebrew
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap the checked-out formula
        run: |
          brew tap wrsrsh/tap
          cp Formula/arelay.rb "$(brew --repository wrsrsh/tap)/Formula/arelay.rb"
      - run: brew style --formula wrsrsh/tap/arelay
      - run: brew install wrsrsh/tap/arelay
      - run: brew test wrsrsh/tap/arelay
      - run: brew audit --strict wrsrsh/tap/arelay
