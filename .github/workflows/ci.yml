name: Homebrew
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        formula: [arelay, tns]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_DEVELOPER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap the checked-out formula
        run: |
          brew tap wrsrsh/tap
          cp "Formula/${{ matrix.formula }}.rb" "$(brew --repository wrsrsh/tap)/Formula/${{ matrix.formula }}.rb"
      - run: brew style --formula wrsrsh/tap/${{ matrix.formula }}
      - run: brew install wrsrsh/tap/${{ matrix.formula }}
      - run: brew test wrsrsh/tap/${{ matrix.formula }}
      - run: brew audit --strict wrsrsh/tap/${{ matrix.formula }}
